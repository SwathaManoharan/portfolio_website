name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-scan-sign-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write   # REQUIRED for Cosign keyless signing

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run lint check
        working-directory: app
        run: npm run lint

      - name: Run unit tests
        working-directory: app
        run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t swatha1711/devops-portfolio:${{ github.sha }} .
          docker tag swatha1711/devops-portfolio:${{ github.sha }} swatha1711/devops-portfolio:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: swatha1711/devops-portfolio:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Push Docker image
        run: |
          docker push swatha1711/devops-portfolio:${{ github.sha }}
          docker push swatha1711/devops-portfolio:latest

      - name: Sign Docker image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign swatha1711/devops-portfolio:${{ github.sha }}
